<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VOX AI</title>
  <style>
    :root{
      --bg:#0c0a18; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
      --txt:#f1f0f5; --muted:rgba(241,240,245,.55);
      --p:#7c3aed; --p2:#5b21b6; --ok:#4ade80; --err:#ef4444;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--txt);min-height:100vh}
    header{position:sticky;top:0;z-index:10;background:rgba(12,10,24,.8);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
    .logo{font-weight:800;letter-spacing:.5px}
    .langs{display:flex;gap:8px}
    .langs button{border:1px solid var(--border);background:transparent;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer}
    .langs button.on{border-color:var(--p);color:#c4b5fd;background:rgba(124,58,237,.12)}
    main{max-width:900px;margin:0 auto;padding:48px 18px;text-align:center}
    h1{margin:0 0 10px;font-size:clamp(28px,4vw,46px);line-height:1.1}
    p{margin:0 auto;max-width:560px;color:var(--muted);line-height:1.7}

    .fab{position:fixed;left:18px;bottom:18px;width:62px;height:62px;border-radius:50%;
      background:linear-gradient(135deg,var(--p),var(--p2));border:0;cursor:pointer;color:white;font-size:20px;
      box-shadow:0 10px 28px rgba(124,58,237,.45)}
    .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
      background:linear-gradient(155deg,rgba(76,29,149,.85),rgba(9,9,11,.97) 58%);backdrop-filter:blur(18px);z-index:999}
    .overlay.open{display:flex}

    .panel{width:min(520px,96vw);border:1px solid var(--border);background:rgba(14,10,28,.78);
      border-radius:22px;overflow:hidden}
    .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
    .status{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:12px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
    .btn{border:1px solid var(--border);background:transparent;color:var(--txt);padding:8px 12px;border-radius:999px;cursor:pointer}
    .body{padding:22px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .circle{width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;color:#fff;
      background:linear-gradient(135deg,var(--p),var(--p2));
      box-shadow:0 0 44px rgba(124,58,237,.40);transition:.18s transform}
    .circle:active{transform:scale(.98)}
    .circle.on{background:linear-gradient(135deg,#dc2626,#991b1b);box-shadow:0 0 48px rgba(220,38,38,.55)}
    .hint{color:var(--muted);font-size:13px}
    .tx{width:100%;max-width:420px;min-height:58px;padding:12px 12px;border-radius:14px;
      border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);text-align:start;line-height:1.5}
    .tx.dim{color:var(--muted)}
  </style>
</head>

<body>
<header>
  <div class="logo">VOX</div>
  <div class="langs">
    <button data-lang="ar" class="on">عربي</button>
    <button data-lang="fr">FR</button>
    <button data-lang="en">EN</button>
  </div>
</header>

<main>
  <h1 id="t-h1">نؤتمت أعمالك بقوة الذكاء الاصطناعي</h1>
  <p id="t-sub">اضغط زر VOX في الأسفل وابدأ محادثة صوتية طبيعية.</p>
</main>

<button class="fab" id="fab" aria-label="Open VOX">VOX</button>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="panel" role="dialog" aria-modal="true">
    <div class="top">
      <div>
        <div style="font-weight:800">VOX AI</div>
        <div class="status"><span class="dot"></span><span id="t-status">جاهز</span></div>
      </div>
      <button class="btn" id="closeBtn">إغلاق</button>
    </div>

    <div class="body">
      <button class="circle" id="toggleBtn">🎙️</button>
      <div class="hint" id="t-hint">اضغط لبدء/إيقاف المحادثة</div>
      <div class="tx dim" id="tx">...</div>
    </div>
  </div>
</div>

<!-- Vapi Web SDK (script tag version: most compatible) -->
<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.2.7/dist/index.umd.js"></script>

<script>
  // ====== CONFIG ======
  const VAPI_PUBLIC_KEY = "e7599e5e-a966-4c6b-83bc-f518f673de57";
  const ASSISTANT_ID = "31391dfd-785f-43e1-aaf3-feefabe16743";

  // ====== i18n ======
  let lang = "ar";
  const T = {
    ar: {
      h1: "نؤتمت أعمالك بقوة الذكاء الاصطناعي",
      sub: "اضغط زر VOX في الأسفل وابدأ محادثة صوتية طبيعية.",
      ready: "جاهز",
      connecting: "جارٍ الاتصال...",
      listening: "يستمع الآن...",
      thinking: "يعالج...",
      ended: "انتهت المحادثة",
      hint: "اضغط لبدء/إيقاف المحادثة",
      close: "إغلاق",
      err: "حدث خطأ. حاول مرة أخرى."
    },
    fr: {
      h1: "Automatisez votre business avec l’IA",
      sub: "Cliquez sur VOX et démarrez une conversation vocale naturelle.",
      ready: "Prêt",
      connecting: "Connexion...",
      listening: "Écoute...",
      thinking: "Traitement...",
      ended: "Appel terminé",
      hint: "Appuyez pour démarrer/arrêter",
      close: "Fermer",
      err: "Erreur. Réessayez."
    },
    en: {
      h1: "Automate your business with AI",
      sub: "Click VOX and start a natural voice conversation.",
      ready: "Ready",
      connecting: "Connecting...",
      listening: "Listening...",
      thinking: "Processing...",
      ended: "Call ended",
      hint: "Tap to start/stop",
      close: "Close",
      err: "Error. Please try again."
    }
  };

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
    document.getElementById("t-h1").textContent = T[l].h1;
    document.getElementById("t-sub").textContent = T[l].sub;
    document.getElementById("t-status").textContent = T[l].ready;
    document.getElementById("t-hint").textContent = T[l].hint;
    document.getElementById("closeBtn").textContent = T[l].close;

    document.querySelectorAll(".langs button").forEach(b=>{
      b.classList.toggle("on", b.dataset.lang === l);
    });
  }

  // ====== UI helpers ======
  const overlay = document.getElementById("overlay");
  const fab = document.getElementById("fab");
  const closeBtn = document.getElementById("closeBtn");
  const toggleBtn = document.getElementById("toggleBtn");
  const statusEl = document.getElementById("t-status");
  const tx = document.getElementById("tx");

  function setTx(text, dim){
    tx.textContent = text;
    tx.classList.toggle("dim", !!dim);
  }

  function openOverlay(){
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden","false");
  }
  function closeOverlay(){
    overlay.classList.remove("open");
    overlay.setAttribute("aria-hidden","true");
  }

  // ====== Vapi ======
  let vapi = null;
  let callOn = false;

  function initVapi(){
    if (vapi) return vapi;
    if (!window.Vapi) throw new Error("Vapi SDK not loaded");

    vapi = new window.Vapi(VAPI_PUBLIC_KEY);

    vapi.on("call-start", () => {
      callOn = true;
      toggleBtn.classList.add("on");
      statusEl.textContent = T[lang].listening;
      setTx((lang==="ar"?"الاتصال نشط — تحدث الآن":"Call active — speak now"), false);
    });

    vapi.on("speech-end", () => {
      statusEl.textContent = T[lang].thinking;
    });

    vapi.on("message", (msg) => {
      if (msg && msg.type === "transcript" && msg.transcript) {
        const prefix =
          msg.role === "user" ? (lang==="ar"?"أنت: ":lang==="fr"?"Vous: ":"You: ")
                              : "VOX: ";
        setTx(prefix + msg.transcript, false);
        if (msg.role === "assistant") statusEl.textContent = T[lang].ready;
      }
    });

    vapi.on("call-end", () => {
      callOn = false;
      toggleBtn.classList.remove("on");
      statusEl.textContent = T[lang].ready;
      setTx(T[lang].ended, false);
    });

    vapi.on("error", () => {
      callOn = false;
      toggleBtn.classList.remove("on");
      statusEl.textContent = T[lang].ready;
      setTx(T[lang].err, false);
    });

    return vapi;
  }

  async function toggleCall(){
    try{
      initVapi();

      // iOS/Safari: ensure this is triggered by a user gesture (click) — it is.
      if (callOn){
        try { vapi.stop(); } catch(e){}
        callOn = false;
        toggleBtn.classList.remove("on");
        statusEl.textContent = T[lang].ready;
        setTx("...", true);
        return;
      }

      statusEl.textContent = T[lang].connecting;
      setTx(T[lang].connecting, true);

      await vapi.start(ASSISTANT_ID);

    }catch(e){
      callOn = false;
      toggleBtn.classList.remove("on");
      statusEl.textContent = T[lang].ready;
      setTx(T[lang].err + (e && e.message ? " ("+e.message+")" : ""), false);
    }
  }

  // ====== events ======
  fab.addEventListener("click", () => { openOverlay(); setTx("...", true); statusEl.textContent = T[lang].ready; });
  closeBtn.addEventListener("click", () => { if(callOn && vapi){ try{vapi.stop();}catch(e){} } callOn=false; toggleBtn.classList.remove("on"); closeOverlay(); });
  toggleBtn.addEventListener("click", toggleCall);

  document.querySelectorAll(".langs button").forEach(b=>{
    b.addEventListener("click", ()=>setLang(b.dataset.lang));
  });

  // initial
  setLang("ar");
</script>
</body>
</html>
